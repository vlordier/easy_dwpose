[tool.poetry]
name = "easy_dwpose"
version = "1.0.2"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.9"
torch = "^2.4.0"
opencv-python = "^4.10.0.84"
numpy = "^1.26.4"
omegaconf = "^2.3.0"
onnxruntime = { version = "^1.19.0", markers = "sys_platform == 'darwin'" }
onnxruntime-gpu = { version = "^1.19.0", markers = "sys_platform == 'linux'" }
loguru = "^0.7.2"
tqdm = "^4.67.0"
imageio = "^2.36.0"
huggingface_hub = "^0.32.0"
matplotlib = "^3.9.4"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.0"
pytest-mock = "^3.14.0"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"



[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "E501", "F841", "F401", "F811", "I", "TYP"]
ignore = ["N", "ANN003", "ANN"]
fixable = ["ALL"]
extend-select = ["T201"]
mccabe = { max-complexity = 9 }

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["ANN", "TYP", "D", "F821", "F401", "PLR0913"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "parametrize: parametrized tests",
    "smoke: marks tests as smoke tests for basic functionality",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning",
]
# Pytest collection configuration
norecursedirs = [".*", "build", "dist", "*.egg"]
